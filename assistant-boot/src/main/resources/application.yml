spring:
  application:
    name: assistant-boot
  main:
    banner-mode: off
  ai:
    mcp:
      client:
        toolcallback:
          enabled: true
        stdio:
          connections:
            github-mcp-server:
              command: /app/mcp-bin/github-mcp-server
              args:
                - "stdio"
              env:
                "GITHUB_PERSONAL_ACCESS_TOKEN": ${GITHUB_PERSONAL_ACCESS_TOKEN}
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key:
      embedding:
        options:
            model: text-embedding-3-large
      chat:
        options:
          model: gemini-2.0-flash
          temperature: 0.3

# --- Custom Domain Configuration Group ---
assistant:
  person:
    first-name: Nevzat
    last-name: Cirak
    role: Lead Software Engineer
    email:
    phoneNumber:
    linkedin-url: https://www.linkedin.com/in/nevzatcirak
    linkedin-data-path: classpath:documents/Profile.csv
    cv-path: classpath:documents/CV.pdf
